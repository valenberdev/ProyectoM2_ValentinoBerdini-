openapi: 3.0.0
info:
  title: MiniBlog API
  version: 1.0.0
  description: API REST para gestionar autores y posts
servers:
  - url: http://localhost:3000
    description: Entorno local
  - url: https://proyectom2valentinoberdini-production.up.railway.app
    description: Entorno producción (Railway)

paths:
  /health:
    get:
      summary: Verifica estado de la API
      responses:
        '200':
          description: API operativa
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string

  /authors:
    get:
      summary: Lista todos los autores
      responses:
        '200':
          description: Lista de autores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Author'
    post:
      summary: Crea un nuevo autor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorCreateInput'
      responses:
        '201':
          description: Autor creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '400':
          description: Validación fallida
        '409':
          description: Email duplicado
        '500':
          description: Error interno del servidor

  /authors/{id}:
    get:
      summary: Obtiene un autor por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Autor encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '400':
          description: ID inválido
        '404':
          description: Autor no encontrado
        '500':
          description: Error interno del servidor
    put:
      summary: Actualiza un autor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorCreateInput'
      responses:
        '200':
          description: Autor actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '400':
          description: Validación o ID inválido
        '409':
          description: Email duplicado
        '404':
          description: Autor no encontrado
        '500':
          description: Error interno del servidor
    delete:
      summary: Elimina un autor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Autor eliminado
        '400':
          description: ID inválido
        '404':
          description: Autor no encontrado
        '500':
          description: Error interno del servidor

  /posts:
    get:
      summary: Lista todos los posts
      responses:
        '200':
          description: Lista de posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
    post:
      summary: Crea un nuevo post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostCreateInput'
      responses:
        '201':
          description: Post creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: Validación fallida
        '500':
          description: Error interno del servidor

  /posts/{id}:
    get:
      summary: Obtiene un post por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Post encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: ID inválido
        '404':
          description: Post no encontrado
        '500':
          description: Error interno del servidor
    put:
      summary: Actualiza un post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostCreateInput'
      responses:
        '200':
          description: Post actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: Validación o ID inválido
        '404':
          description: Post no encontrado
        '500':
          description: Error interno del servidor
    delete:
      summary: Elimina un post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Post eliminado
        '400':
          description: ID inválido
        '404':
          description: Post no encontrado
        '500':
          description: Error interno del servidor

  /posts/author/{authorId}:
    get:
      summary: Lista posts por autor
      parameters:
        - name: authorId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Lista de posts del autor
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
        '400':
          description: ID inválido
        '500':
          description: Error interno del servidor

  /posts/{id}/comments:
    get:
      summary: Lista comentarios de un post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Lista de comentarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
        '400':
          description: ID inválido
        '500':
          description: Error interno del servidor
    post:
      summary: Crea un comentario en un post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentCreateInput'
      responses:
        '201':
          description: Comentario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          description: Validación fallida
        '500':
          description: Error interno del servidor

components:
  schemas:
    AuthorCreateInput:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          minLength: 1
          example: Ana García
        email:
          type: string
          format: email
          example: ana@example.com
        bio:
          type: string
          example: Desarrolladora backend
    PostCreateInput:
      type: object
      required: [title, content, author_id]
      properties:
        title:
          type: string
          minLength: 1
          example: Introducción a PostgreSQL
        content:
          type: string
          minLength: 1
          example: PostgreSQL es una base de datos relacional...
        author_id:
          type: integer
          minimum: 1
          example: 1
        published:
          type: boolean
          example: false
    CommentCreateInput:
      type: object
      required: [author_id, content]
      properties:
        author_id:
          type: integer
          minimum: 1
          example: 1
        content:
          type: string
          minLength: 1
          example: Excelente artículo.
    Author:
      type: object
      required: [id, name, email, created_at]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        bio:
          type: string
        created_at:
          type: string
          format: date-time
    Post:
      type: object
      required: [id, title, content, author_id, published, created_at]
      properties:
        id:
          type: integer
        title:
          type: string
        content:
          type: string
        author_id:
          type: integer
        published:
          type: boolean
        created_at:
          type: string
          format: date-time
    Comment:
      type: object
      required: [id, post_id, author_id, content, created_at]
      properties:
        id:
          type: integer
        post_id:
          type: integer
        author_id:
          type: integer
        content:
          type: string
        created_at:
          type: string
          format: date-time